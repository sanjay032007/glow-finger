<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />

    <meta charset="UTF-8" />
    <script>
      // Global error diagnostics banner (Safe from null body)
      window.addEventListener('error', function(e) {
        var targetNode = document.body || document.documentElement;
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '0';
          div.style.left = '0';
          div.style.width = '100%';
          div.style.background = 'rgba(255, 0, 0, 0.95)';
          div.style.color = 'white';
          div.style.padding = '15px';
          div.style.zIndex = '99999';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '12px';
          div.innerHTML = '<strong>Resource Load Failure:</strong> Failed to load script/style from: ' + (e.target.src || e.target.href) + '<br>Please check network connection or browser privacy shields.';
          if (targetNode) targetNode.appendChild(div);
        } else {
          var div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '60px';
          div.style.left = '0';
          div.style.width = '100%';
          div.style.background = 'rgba(255, 0, 0, 0.9)';
          div.style.color = 'white';
          div.style.padding = '15px';
          div.style.zIndex = '99999';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '12px';
          div.style.wordBreak = 'break-all';
          div.innerHTML = '<strong>Uncaught Error:</strong> ' + e.message + ' at ' + e.filename + ':' + e.lineno;
          if (targetNode) targetNode.appendChild(div);
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var targetNode = document.body || document.documentElement;
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '120px';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'rgba(255, 68, 68, 0.9)';
        div.style.color = 'white';
        div.style.padding = '15px';
        div.style.zIndex = '99999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '12px';
        div.style.wordBreak = 'break-all';
        div.innerHTML = '<strong>Unhandled Rejection:</strong> ' + e.reason;
        if (targetNode) targetNode.appendChild(div);
      });

          </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Glow Finger Draw</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
    

  </head>
  <body>
    
    <div id="initial-loader" style="position:fixed;inset:0;background:#030305;z-index:999999;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease;flex-direction:column;gap:20px;">
      <div style="width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,0.1);border-top-color:#00f3ff;animation:spin 0.8s linear infinite;"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <div style="color:rgba(255,255,255,0.5);font-family:sans-serif;font-weight:bold;letter-spacing:4px;font-size:10px;">LOADING STUDIO</div>
    </div>
    <div id="root"></div>
    <script>
      // Remove loader when React mounts or after timeout
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
          }
        }, 150);
      });
    </script>
  
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
