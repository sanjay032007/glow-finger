<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Global error diagnostics banner (Safe from null body)
      window.addEventListener('error', function(e) {
        var targetNode = document.body || document.documentElement;
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '0';
          div.style.left = '0';
          div.style.width = '100%';
          div.style.background = 'rgba(255, 0, 0, 0.95)';
          div.style.color = 'white';
          div.style.padding = '15px';
          div.style.zIndex = '99999';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '12px';
          div.innerHTML = '<strong>Resource Load Failure:</strong> Failed to load script/style from: ' + (e.target.src || e.target.href) + '<br>Please check network connection or browser privacy shields.';
          if (targetNode) targetNode.appendChild(div);
        } else {
          var div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '60px';
          div.style.left = '0';
          div.style.width = '100%';
          div.style.background = 'rgba(255, 0, 0, 0.9)';
          div.style.color = 'white';
          div.style.padding = '15px';
          div.style.zIndex = '99999';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '12px';
          div.style.wordBreak = 'break-all';
          div.innerHTML = '<strong>Uncaught Error:</strong> ' + e.message + ' at ' + e.filename + ':' + e.lineno;
          if (targetNode) targetNode.appendChild(div);
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var targetNode = document.body || document.documentElement;
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '120px';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'rgba(255, 68, 68, 0.9)';
        div.style.color = 'white';
        div.style.padding = '15px';
        div.style.zIndex = '99999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '12px';
        div.style.wordBreak = 'break-all';
        div.innerHTML = '<strong>Unhandled Rejection:</strong> ' + e.reason;
        if (targetNode) targetNode.appendChild(div);
      });

          </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Glow Finger Draw</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
